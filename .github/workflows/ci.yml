name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-und-test:
    name: Bauen und testen (Linux)
    # Feste Image-Version: `ubuntu-latest` sprang am 11.11.2026 auf 26.04, dort
    # hing `apt-get update` an nicht erreichbaren Mirrors und der Lauf brach in
    # den Systempaketen ab.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Schriften kommen aus dem Repo (packaging/fonts), nicht aus apt: die
      # GitHub-Mirrors waren am 11.11.2026 minutenlang nicht erreichbar, der
      # Lauf hing in den Systempaketen fest. Das Programm sucht seine Schriften
      # in festen Pfaden (crates/jjcad-core/src/fonts.rs), darum dorthin kopieren.
      - name: Schriften aus dem Repository
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/liberation /usr/share/fonts/truetype/quicksand
          sudo cp packaging/fonts/Liberation*.ttf /usr/share/fonts/truetype/liberation/
          sudo cp packaging/fonts/Quicksand*.ttf /usr/share/fonts/truetype/quicksand/
          sudo fc-cache -f >/dev/null

      # egui/eframe braucht auf Linux die Fenster- und GL-Bibliotheken. Sie sind
      # im Läufer-Image vorhanden; apt nur als Nachschlag mit Zeitlimit, damit
      # ein langsamer Mirror den Lauf nicht blockiert.
      - name: Systempakete (mit Zeitlimit)
        continue-on-error: true
        run: |
          timeout 120 sudo apt-get update || true
          timeout 240 sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev || true

      - name: Rust-Werkzeuge
        uses: dtolnay/rust-toolchain@stable

      - name: Build-Zwischenspeicher
        uses: Swatinem/rust-cache@v2

      - name: Bauen
        run: cargo build --workspace --all-targets

      - name: Tests
        # CI-Läufer sind langsamer als der Entwicklungsrechner; das Zeitbudget
        # der Performance-Tests wird dort angehoben (lokal gilt 200 ms).
        env:
          JJCAD_PERF_BUDGET_MS: 600
        run: cargo test --workspace

      # Die Windows-Fassung bettet Liberation und Quicksand in die .exe ein
      # (T0205). Auf Linux ist das abgeschaltet, damit der Build die
      # Systemschriften benutzt — das Merkmal prüft die Tabelle trotzdem:
      # jede Kombination aus Familie und Schnitt muss vorhanden sein.
      - name: Eingebettete Schriften (Windows-Tabelle)
        run: cargo test -p jjcad-core --features schriften-eingebettet --lib schriften_eingebettet
