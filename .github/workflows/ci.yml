name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-und-test:
    name: Bauen und testen (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # egui/eframe braucht auf Linux die Fenster- und GL-Bibliotheken.
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Rust-Werkzeuge
        uses: dtolnay/rust-toolchain@stable

      - name: Build-Zwischenspeicher
        uses: Swatinem/rust-cache@v2

      - name: Bauen
        run: cargo build --workspace --all-targets

      - name: Tests
        # CI-Läufer sind langsamer als der Entwicklungsrechner; das Zeitbudget
        # der Performance-Tests wird dort angehoben (lokal gilt 200 ms).
        env:
          JJCAD_PERF_BUDGET_MS: 600
        run: cargo test --workspace
