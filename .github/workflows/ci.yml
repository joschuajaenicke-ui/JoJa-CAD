name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-und-test:
    name: Bauen und testen (Linux)
    # Feste Image-Version: `ubuntu-latest` sprang am 11.11.2026 auf 26.04, dort
    # hing `apt-get update` an nicht erreichbaren Mirrors und der Lauf brach in
    # den Systempaketen ab.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # egui/eframe braucht auf Linux die Fenster- und GL-Bibliotheken.
      # Die Schriften sind Teil der Tests: das Programm setzt mit den
      # Systemschriften (Liberation, Quicksand) und prüft das auch.
      - name: Systempakete
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            fonts-liberation fonts-liberation-sans-narrow fonts-quicksand

      - name: Rust-Werkzeuge
        uses: dtolnay/rust-toolchain@stable

      - name: Build-Zwischenspeicher
        uses: Swatinem/rust-cache@v2

      - name: Bauen
        run: cargo build --workspace --all-targets

      - name: Tests
        # CI-Läufer sind langsamer als der Entwicklungsrechner; das Zeitbudget
        # der Performance-Tests wird dort angehoben (lokal gilt 200 ms).
        env:
          JJCAD_PERF_BUDGET_MS: 600
        run: cargo test --workspace
