[package]
name = "jjcad-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JoJa-CAD Desktop-Anwendung (2D-CAD für Architektur)"

[[bin]]
name = "jjcad"
path = "src/main.rs"

# Symbol und Versionsangaben in die .exe einbetten (nur Windows).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[dependencies]
jjcad-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
# Markenzeichen: die PNG-Datei unter assets/ wird zur Laufzeit dekodiert
png = "0.17"
# Systemweiter Dateidialog (Linux: XDG-Portal, Windows: Win32, macOS: NSOpenPanel)
rfd = "0.17"
# Fensterkennung des Hauptfensters, damit der Systemdialog an diesem Fenster hängt
raw-window-handle = "0.6"
# System-Zwischenablage für **Bilder** (T0112): Strg+C legt ein einzelnes Bild
# als reine Bilddaten ab, Strg+V übernimmt ein Bild aus einem anderen Programm.
# egui selbst kann nur Text — die Kiste spricht X11, Windows und macOS an,
# deshalb steht sie hier und nicht im Linux-Block (T0241: der falsche Block
# ließ die Windows- und macOS-Läufe mit „cannot find crate `arboard`" scheitern).
# `wayland-data-control` ist Pflicht: unter Wayland läuft das Programm als
# Wayland-Client, und der X11-Weg über XWayland liefert Bilder aus anderen
# Wayland-Programmen nicht (KWin brückt dort nur Text). arboard nimmt den
# nativen Weg, wenn `WAYLAND_DISPLAY` gesetzt ist, und fällt sonst auf X11
# zurück. Auf Windows und macOS hat das Merkmal keine Wirkung.
arboard = { version = "3.7", features = ["wayland-data-control"] }

# T0224: Fenster unter Wayland in den Vordergrund holen. winit reicht das
# `xdg-activation`-Token nicht an die Fenstererzeugung weiter und
# `ViewportCommand::Focus` ist dort wirkungslos — das Protokoll wird deshalb
# selbst gesprochen, auf der Verbindung des Fensters (siehe aktivieren.rs).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
