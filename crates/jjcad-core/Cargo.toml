[features]
# Windows-Fassung: Liberation und Quicksand liegen mit in der Programmdatei
# (`src/schriften_eingebettet.rs`, T0205). Das Merkmal erlaubt denselben Weg auf
# Linux zu prüfen (`cargo test -p jjcad-core --features schriften-eingebettet`);
# ausgeliefert wird es nur unter Windows, wo `cfg(windows)` es ohnehin setzt.
default = []
schriften-eingebettet = []

[package]
name = "jjcad-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kern von JoJa-CAD: Geometrie, Modell, Displayliste, PDF/DXF-Export"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Headless-Rendering (PNG) und PDF-Export laufen ohne GUI.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
ab_glyph = "0.2"
# PDF-Lesen (Import): Parser, Objektzugriff, FlateDecode
lopdf = { version = "0.46", default-features = false }
# PDF-Streams packen (FlateDecode) — liegt über lopdf ohnehin im Baum
flate2 = "1"
# Bilder (PNG/JPEG) einlesen: Import, Anzeige, PNG- und PDF-Ausgabe
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Sicherung (T0129): Hash-Vergleich der Stände und Kennung neuer Dokumente.
sha2 = "0.11"

# Ortszeit für den Zeitstempel der Stände (nur Anzeige).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
