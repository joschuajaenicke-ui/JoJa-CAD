sicherung = "Backup"
sicherung_erklaerung = "The backup keeps intermediate snapshots in its own folder and thins them out by age: dense near the present, coarse further back. It never writes to your drawing — only “Save” does that. It protects against crashes and forgotten saves, not against disk failure."
