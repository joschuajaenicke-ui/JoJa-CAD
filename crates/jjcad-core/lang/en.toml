sicherung_hint = "For protection against disk failure, put the backup folder on a network drive with redundant backup (Settings · Storage locations · Backups)."
sicherung_mehr_dateien = "{dateien} drawings in the backup folder — more than backups. Each drawing keeps its newest and its oldest snapshot, so the folder grows to {plaetze} snapshots. For history: raise the number of backups."
sicherung_verworfen = "Discarded"
sicherung_verworfen_tip = "Work that was discarded when closing. It stays in the backup folder until it expires (trash) and does not come back by itself."
