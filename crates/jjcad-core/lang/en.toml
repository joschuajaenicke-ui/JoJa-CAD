sicherung_anzahl_tip = "How many backups are kept in total — across all drawings. At least 30; if there is not enough room for one backup per drawing, the program raises the number itself."
sicherung_zeitraum = "Retention period"
sicherung_zeitraum_tip = "How far back the backups should reach — counted in working hours (8 hours per working day), not calendar days. A quarter is 480 working hours, about 60 working days in continuous use."
sicherung_intervall = "Back up every"
sicherung_intervall_tip = "Interval between two backups in minutes. A larger interval makes sense on a network drive — every snapshot is written."
sicherung_minuten = "minutes"
sicherung_minute = "minute"
sicherung_abstand = "Snapshot spacing"
sicherung_abstand_tip = "Average spacing between two neighbouring snapshots, as a percentage of their age. It follows from count and period and cannot be set."
sicherung_abstand_beispiel = "Example: one hour back, snapshots are about {stunde} minutes apart; one working day (8 h) back, about {tag} minutes."
