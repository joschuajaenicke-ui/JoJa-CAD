# JoJa-CAD — deutscher Sprachkatalog (Quellsprache und Rückfall), T0103
#
# Aufbau: eine Tabelle je Schlüssel, darin `label` und `hint`.
#   [action.draw.wall]      -> Schlüssel action.draw.wall.label / .hint
#   [ribbon.group]          -> Schlüssel ribbon.group.<name>
# Schlüssel sind neutral und stabil (nicht der deutsche Text). Fehlt ein
# Schlüssel in einer Übersetzung, erscheint dieser deutsche Text; fehlt er
# auch hier, bleibt der Schlüssel stehen und das Programm warnt im Debug-Bau.
#
# Eine weitere Sprache: Datei lang/<code>.toml anlegen, in
# crates/jjcad-core/src/i18n.rs eintragen (KATALOG_QUELLEN), fertig.
#
# Platzhalter sind benannt: {name} — eine Übersetzung darf die Reihenfolge
# ändern.

