# JoJa-CAD v0.2 — 2D-CAD für Architektur (Bauantragszeichnungen)
[workspace]
resolver = "2"
members = [
    "crates/jjcad-core",
    "crates/jjcad-gui",
    "crates/jjcad-mcp",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
authors = ["Joschua Jaenicke <joschua.jaenicke@gmail.com>"]
license = "GPL-3.0-or-later"
description = "2D-CAD für Architektur- und Bauantragszeichnungen (Rust, egui)"
readme = "README.md"
keywords = ["cad", "drawing", "architecture", "dxf", "pdf"]
categories = ["graphics", "visualization"]
rust-version = "1.88"

[workspace.dependencies]
jjcad-core = { path = "crates/jjcad-core" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: Fließkommazahlen müssen den Weg Datei → Wert → Datei
# bitgleich überstehen. Ohne das Merkmal liest der Parser einzelne Werte ein
# Bit daneben; die neu geöffnete Zeichnung galt dann als geändert, obwohl sie
# gerade gespeichert wurde (gesehen an den Punktsymbolen T0210).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
